<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IIT Asistencia</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">IIT</span><span class="product">Asistencia</span></div>
    <nav id="modules"></nav>
    <div class="top-right">
      <span id="dev-status" class="dev-status" title="Estado de equipos"></span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="page-tab"><span id="page-title"></span></div>
      <div id="page"></div>
    </main>
  </div>

  <div class="modal-back" id="modal-back">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="x" id="modal-close" aria-label="Cerrar">×</button></div>
      <form id="modal-form" novalidate>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-error" id="modal-error"></div>
        <div class="modal-foot">
          <button type="submit" class="btn primary" id="modal-ok">Confirmar</button>
          <button type="button" class="btn" id="modal-cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
